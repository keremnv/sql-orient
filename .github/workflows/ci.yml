name: public-ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest build 'tomli; python_version < "3.11"'
      - name: Product tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Public docs and figures
        run: |
          python scripts/render_evidence.py --check
          python scripts/check_docs.py
      - name: Build both artifacts
        run: python -m build
      - name: Require alias removal in all distributions
        run: python scripts/check_public_release.py . dist/*.whl dist/*.tar.gz
      - name: Public boundary scan
        run: python scripts/check_boundary.py . dist/*.whl dist/*.tar.gz
      - name: Installed wheel and quickstart outside checkout
        run: python scripts/check_installed.py dist/*.whl
